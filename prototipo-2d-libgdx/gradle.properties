# Limites de memória: o build roda num único processo pequeno.
# Se tiver RAM sobrando, pode subir o -Xmx para 1536m ou 2g para compilar mais rápido.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false

android.useAndroidX=true
android.nonTransitiveRClass=true

gdxVersion=1.13.1
